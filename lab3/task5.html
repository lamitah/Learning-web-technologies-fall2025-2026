<html>

<head>
    <title>Task 5 - Degree</title>
    <script>
        function validateForm() {
            let degrees = document.getElementsByName("degree");
            let err = document.getElementById("err");
            err.innerHTML = "";
            let checked = false;
            for (let d of degrees) if (d.checked) checked = true;
            if (!checked) {
                err.innerHTML = "Select at least one degree";
                return false;
            }
            return true;
        }
    </script>
</head>

<body>
    <h3>Task 5: Degree</h3>
    <form onsubmit="return validateForm()">
        <input type="checkbox" name="degree" value="SSC">SSC
        <input type="checkbox" name="degree" value="HSC">HSC
        <input type="checkbox" name="degree" value="BSc">BSc
        <input type="checkbox" name="degree" value="MSc">MSc<br>
        <span id="err" style="color: red;"></span><br><br>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
