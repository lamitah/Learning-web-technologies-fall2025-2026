<html>

<head>
    <title>Task 6 - Blood Group</title>
    <script>
        function validateForm() {
            let blood = document.getElementById("blood").value;
            let err = document.getElementById("err");
            err.innerHTML = "";
            if (blood === "") {
                err.innerHTML = "Select a blood group";
                return false;
            }
            return true;
        }
    </script>
</head>

<body>
    <h3>Task 6: Blood Group</h3>
    <form onsubmit="return validateForm()">
        <select id="blood">
            <option value="">A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select><br>
        <span id="err" style="color: red;"></span><br><br>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
