<html lang="en">

<head>
    <title>Simple Creator</title>
</head>

<body>
    <label>Info:</label>
    <input type="text" id="infoInput"><br><br>

    <label>Type:</label>
    <select id="typeSelect">
        <option value="Text">Text</option>
        <option value="Number">Number</option>
        <option value="DOB">DOB</option>
        <option value="Radio button">Radio button</option>
    </select><br><br>

    <div id="additionalField"></div> <!-- Placeholder for additional fields -->

    <button id="addBtn">Add</button><br><br>

    <textarea id="previewBox" rows="4" cols="30" readonly></textarea><br><br>

    <button id="saveBtn">Save</button>

    <div id="savedOutput"></div>

    <script src="javascript.js"></script>
</body>

</html>
